<!doctype html>
<html lang="en" class="green_theme">
<head>
  <meta charset="utf-8">
  <title>Modernize Angular Admin Template</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://code.iconify.design/2/2.0.3/iconify.min.js"></script>
  <!-- Polyfills for Node.js globals - must be loaded before any chunks -->
  <script>
    // Polyfills for Node.js globals - required by crypto-browserify and other Node.js polyfills
    // This must run before any module chunks are loaded
    (function() {
      var root = typeof globalThis !== 'undefined' ? globalThis : 
                 typeof window !== 'undefined' ? window : 
                 typeof self !== 'undefined' ? self : 
                 typeof global !== 'undefined' ? global : {};
      
      // Polyfill for 'global'
      if (typeof root.global === 'undefined') {
        root.global = root;
      }
      
      // Also set on window for browser environments
      if (typeof window !== 'undefined') {
        window.global = root;
      }
      
      // Polyfill for 'process' - minimal stub with commonly used properties
      if (typeof root.process === 'undefined') {
        root.process = {
          env: {
            NODE_ENV: 'production'
          },
          version: '',
          versions: {},
          platform: 'browser',
          browser: true,
          nextTick: function(fn) {
            setTimeout(fn, 0);
          },
          cwd: function() { return '/'; },
          chdir: function() {},
          umask: function() { return 0; },
          exit: function() {},
          kill: function() {},
          pid: 1,
          title: 'browser',
          argv: [],
          execPath: '',
          stdin: null,
          stdout: null,
          stderr: null
        };
      }
      
      // Also set on window for browser environments
      if (typeof window !== 'undefined') {
        window.process = root.process;
      }
    })();
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
