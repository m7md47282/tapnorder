
<mat-sidenav-container class="mainWrapper green_theme light-theme" autosize autoFocus dir="ltr">
  <!-- ============================================================== -->
  <!-- Vertical Sidebar -->
  <!-- ============================================================== -->
  <mat-sidenav #leftsidenav mode="over" [opened]="options.sidenavOpened"
    (openedChange)="onSidenavOpenedChange($event)" (closedStart)="onSidenavClosedStart()" 
    [class.sidebarNav-collapsed]="options.sidenavCollapsed && options.sidenavOpened" class="sidebarNav">
    <div class="flex-layout">
      <app-sidebar (toggleMobileNav)="sidenav.toggle()" [showToggle]="true" [collapsed]="!options.sidenavOpened"></app-sidebar>
      <ng-scrollbar class="position-relative" style="height: 100%">
        <mat-nav-list class="sidebar-list" [class.sidebar-list-collapsed]="!options.sidenavOpened">
          @for(item of navItems; track item) {
          <app-nav-item [item]="item" [collapsed]="!options.sidenavOpened" (notify)="sidenav.toggle()">
          </app-nav-item>
          }
        </mat-nav-list>
      </ng-scrollbar>
      <!-- PRO promotional section removed -->
    </div>
  </mat-sidenav>
  
  <!-- ============================================================== -->
  <!-- Main Content -->
  <!-- ============================================================== -->
  <mat-sidenav-content class="contentWrapper" #content>
    <!-- ============================================================== -->
    <!-- VerticalHeader -->
    <!-- ============================================================== -->
    
    <app-header [showToggle]="true" (toggleMobileNav)="sidenav.toggle()" (toggleCollapsed)="toggleCollapsed()"></app-header>
    
    <main class="pageWrapper ">
      <!-- ============================================================== -->
      <!-- Outlet -->
      <!-- ============================================================== -->
      <router-outlet></router-outlet>
    </main>


  </mat-sidenav-content>

</mat-sidenav-container>
