<mat-toolbar class="topbar gap-10">

  <!-- Mobile Menu -->
  
  <button mat-icon-button (click)="toggleMobileNav.emit()" class="d-flex d-lg-none justify-content-center">
    <i-tabler name="menu-2" class="icon-20 d-flex"></i-tabler>
  </button>

  <!-- Desktop Sidebar Toggle -->
  <button mat-icon-button (click)="toggleCollapsed.emit()" class="d-none d-lg-flex justify-content-center" aria-label="Toggle Sidebar">
    <i-tabler name="menu-2" class="icon-20 d-flex"></i-tabler>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Notifications">
    <i-tabler class="d-flex" name="bell" matBadge="1" matBadgeColor="primary"></i-tabler>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item>Item 1</button>
    <button mat-menu-item>Item 2</button>
  </mat-menu>


  <span class="flex-1-auto"></span>

  <!-- --------------------------------------------------------------- -->
  <!-- profile Dropdown -->
  <!-- --------------------------------------------------------------- -->
  <div class="d-flex align-items-center m-r-16" *ngIf="currentUser">
    <span class="m-r-8 f-s-14">{{ getUserDisplayName() }}</span>
    <span class="m-r-8 f-s-12 text-muted">({{ currentUser.role }})</span>
  </div>
  <button mat-mini-fab [matMenuTriggerFor]="profilemenu" aria-label="User Menu">
    <img src="/assets/images/profile/user-1.jpg" class="rounded-circle object-cover d-block" width="35" />
  </button>
  <mat-menu #profilemenu="matMenu" class="cardWithShadow topbar-dd">
    <div class="p-x-16 p-y-12" *ngIf="currentUser">
      <div class="f-w-600">{{ getUserDisplayName() }}</div>
      <div class="f-s-12 text-muted">{{ currentUser.email }}</div>
      <div class="f-s-12 text-muted m-t-4">{{ currentUser.role }}</div>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item [routerLink]="['/settings']">
      <mat-icon class="d-flex align-items-center"><i-tabler name="settings" class="icon-18 d-flex"></i-tabler></mat-icon>Settings
    </button>
    <button mat-menu-item [routerLink]="['/settings']">
      <mat-icon class="d-flex align-items-center"><i-tabler name="user" class="icon-18 d-flex"></i-tabler></mat-icon>My Profile
    </button>
    <mat-divider></mat-divider>
    <div class="p-x-12 m-t-12">
      <button mat-stroked-button class="w-100" (click)="logout()">
        <i-tabler name="logout" class="icon-16 m-r-8"></i-tabler>Logout
      </button>
    </div>
  </mat-menu>
</mat-toolbar>
