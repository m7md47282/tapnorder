<h2 mat-dialog-title>Add Branch for {{ data.place.name }}</h2>

<mat-dialog-content>
  <form [formGroup]="branchForm">
    <mat-form-field appearance="outline">
      <mat-label>Branch name</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="branchForm.get('name')?.invalid">Name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput rows="2" formControlName="description"></textarea>
    </mat-form-field>

    <div formGroupName="contact" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" />
        <mat-error *ngIf="branchForm.get('contact.email')?.hasError('email')">Invalid email</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Website</mat-label>
        <input matInput formControlName="website" />
      </mat-form-field>
    </div>

    <div formGroupName="address" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Street</mat-label>
        <input matInput formControlName="street" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>City</mat-label>
        <input matInput formControlName="city" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>State</mat-label>
        <input matInput formControlName="state" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Postal code</mat-label>
        <input matInput formControlName="zipCode" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Country</mat-label>
        <input matInput formControlName="country" />
      </mat-form-field>
    </div>

    <div formGroupName="settings" class="toggle-grid">
      <mat-slide-toggle formControlName="allowOnlineOrders">Allow online orders</mat-slide-toggle>
      <mat-slide-toggle formControlName="requireOrderConfirmation">Require confirmation</mat-slide-toggle>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()">Create branch</button>
</mat-dialog-actions>
